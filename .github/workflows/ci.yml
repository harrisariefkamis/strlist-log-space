name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + uji (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pasang paket + alat dev
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Uji unit (fixture buatan sendiri, tanpa jaringan)
        run: pytest -q

  integration:
    name: Uji pada dataset publik
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pasang paket + alat dev
        run: python -m pip install -e ".[dev]"
      - name: Unduh dataset (CC BY 4.0, LogTriage)
        run: git clone --depth 1 https://github.com/logtriage-cyber/security-log-samples data/external/security-log-samples
      - name: Uji integrasi
        run: pytest -m integration -q
